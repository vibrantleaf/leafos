# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: gecko
description: experimental OpenSUSE based LeafOS
base-image: "ghcr.io/vibrantleaf/opensuse-bootc"
image-version: latest
alt-tags:
  - tumbleweed
platforms:
  - linux/amd64
modules:
  - type: files
    files:
      - source: rootfs/gecko/amd64/basic
        destination: /
  - type: script
    snippets:
      ## add packman repo
      - "zypper --non-interactive addrepo -cfp 90 'https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/' packman"
      - "zypper --non-interactive refresh"
      - "zypper --non-interactive dist-upgrade --from packman --allow-vendor-change"

      # add media codecs
      - "zypper --non-interactive install --from packman ffmpeg gstreamer-plugins-{good,bad,ugly,libav} libavcodec vlc-codecs"
      
      # add gnome
      - "zypper --non-interactive install -t pattern gnome"
      - "zypper --non-interactive install gdm"
      
      # add oci essentals
      - "zypper --non-interactive install podman crun distrobox"
      
      # add shell essentals
      - "zypper --non-interactive install bash fish dash dash-sh just"
      
      # add flatpak
      - "zypper --non-interactive install flatpak flatpak-remote-flathub"

      # remove unwanted packages
      - "zypper --non-interactive remove firefox firefox-langpacks yast2"
  - type: script
    snippets:
      - "/bin/bash -c '$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)'"
  - type: systemd
    system:
      enabled:
        - gdm
  - type: signing
