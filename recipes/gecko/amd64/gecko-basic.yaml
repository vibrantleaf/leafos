 ---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: gecko
description: experimental OpenSUSE based LeafOS
base-image: "ghcr.io/vibrantleaf/opensuse-bootc"
image-version: latest
alt-tags:
  - tumbleweed
platforms:
  - linux/amd64
modules:
  - type: files
    files:
      - source: rootfs/gecko/amd64/basic
        destination: /
  - type: script
    snippets:
      - zypper install -t pattern gnome -y
      - zypper install -y gdm
  - type: zypper
    install:
      packages:
         - git
         - podman
         - bash
         - fish
    remove:
      packages:
         - firefox
         - firefox-langpacks
  - type: systemd
    system:
      enabled:
        - gdm
  - type: signing
