# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: gecko
description: experimental OpenSUSE based LeafOS
base-image: "ghcr.io/vibrantleaf/opensuse-bootc"
image-version: latest
alt-tags:
  - tumbleweed
platforms:
  - linux/amd64
modules:
  - type: files
    files:
      - source: rootfs/gecko/amd64/basic
        destination: /
  - type: script
    snippets:
      ## add packman repo
      #- "yes a | zypper addrepo -cfp 90 'https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/Essentials/' packman-essentials"
      #- "yes a | zypper addrepo -cfp 90 'https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/Extra/' packman-extra"
      #- "yes a | zypper addrepo -cfp 90 'https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/Games/' packman-games"
      #- "yes a | zypper addrepo -cfp 90 'https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/Multimedia/' packman-multimedia"
      #- "zypper refresh"
      #- "zypper dist-upgrade -y --from packman-essentials --allow-vendor-change"
      #- "zypper dist-upgrade -y --from packman-extra --allow-vendor-change"
      #- "zypper dist-upgrade -y --from packman-games --allow-vendor-change"
      #- "zypper dist-upgrade -y --from packman-multimedia --allow-vendor-change"

      ## add media codecs
      #- "zypper install -y --from packman ffmpeg gstreamer-plugins-{good,bad,ugly,libav} libavcodec vlc-codecs"
      
      # add gnome
      - "zypper install -t pattern gnome -y"
      - "zypper install -y gdm"
      
      # add oci essentals
      - "zypper install -y podman crun distrobox"
      
      # add shell essentals
      - "zypper install -y bash fish dash dash-sh just"
      
      # add flatpak
      - "zypper install -y flatpak flatpak-remote-flathub"

      # remove unwanted packages
      - "zypper remove -y firefox firefox-langpacks yast2"
  - type: script
    snippets:
      - "/bin/bash -c '$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)'"
  - type: systemd
    system:
      enabled:
        - gdm
  - type: signing
