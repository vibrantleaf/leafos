---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: leafos-nvidia
description: My Custom Build of Universal Blue's Bazzite Image
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: stable
alt-tags:
  - stable
  - amd64-stable
platforms:
  - linux/amd64
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - mimalloc
        - gamemode
        - mangohud
        - git
        - btop
        - arc-theme
        - papirus-icon-theme
        - gnome-menus
        - nushell
        - fish
    remove:
      auto-remove: true
      packages:
        - firefox
        - htop
  - type: script
    scripts:
      - "amd64/build.sh"
  - type: default-flatpaks
    configurations:
    - notify: true
      scope: system
      repo:
        title: Flathub (system)
      install: 
        - app.zen_browser.zen
  - type: copy
    from: ghcr.io/ublue-os/bluefin:stable
    src: /usr/share/backgrounds
    dest: /usr/share/backgrounds
  - type: copy
    from: ghcr.io/ublue-os/bluefin:stable 
    src: /usr/share/gnome-background-properties
    dest: /usr/share/gnome-background-properties
  - type: gschema-overrides
    include:
      - leafos.gschema.override
  - type: gnome-extensions
    install:
      - 307 # Dash to Dock
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 3193 # Blur my Shell
      - 517 # Caffeine
      - 7065 # Tiling Shell
      - 779 # Clipboard Indicator
      - 1319 # GSConnect
      - 3628 # ArcMenu
      - 4655 # Date Menu Formatter
      - 8098 # Wellbeing Toggle
      - 7048 # Rounded Window Corners Reborn
      - 8261 # SimpleWeather
      - 9983 # Touchshell
  - type: os-release
    properties:
      ID: leafos_workstation
      NAME: LeafOSWorkstation
      PRETTY_NAME: "LeafOS Workstation"
  - type: signing
