---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: leafos
description: My Custom Build of Universal Blue's Bazzite Image
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable
alt-tags:
  - stable
  - amd64-stable
platforms:
  - linux/amd64
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - mimalloc
        - gamemode
        - git
        - btop
    remove:
      auto-remove: true
      packages:
        - firefox
        - htop
  - type: script
    scripts:
      - "amd64/build.sh"
  - type: default-flatpaks
    configurations:
    - notify: true
      scope: system
      repo:
        title: Flathub (system)
      install: 
        - app.zen_browser.zen
      remove:
        - org.mozilla.firefox
  - type: containerfile
    snippets:
      - COPY --from ghcr.io/ublue-os/bluefin:stable /usr/share/backgrounds/* /usr/share/backgrounds
      - COPY --from ghcr.io/ublue-os/bluefin:stable /usr/share/gnome-background-properties/* /usr/share/gnome-background-properties
  - type: signing