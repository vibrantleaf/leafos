---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: sawfish
description: My Custom Build of Universal Blue's Bluefin LTS Image
base-image: ghcr.io/ublue-os/bluefin
image-version: lts-hwe
alt-tags:
  - stable
  - lts
  - lts-hwe
  - lts-hwe-stable
  - arm64-stable
  - arm64-lts
  - arm64-lts-hwe
  - arm64-lts-hwe-stable
platforms:
  - linux/arm64
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - mimalloc
        - git
        - btop
        - arc-theme
        - papirus-icon-theme
        - gtk2 # needed: for steam on arm64 support
        - gnome-menus
        - nushell
        - fish
    remove:
      auto-remove: true
      packages:
        - firefox
        - htop
  - type: script
    scripts:
      - "arm64/build.sh"
      #- "arm64/box64.sh"
    snippets:
      - "rm /usr/sysctl.d/ntsync.conf"
  - type: default-flatpaks
    configurations:
    - notify: true
      scope: system
      repo:
        title: Flathub (system)
      install: 
        - app.zen_browser.zen
  - type: copy
    from: ghcr.io/ublue-os/bluefin:stable
    src: /usr/share/backgrounds
    dest: /usr/share/backgrounds
  - type: copy
    from: ghcr.io/ublue-os/bluefin:stable 
    src: /usr/share/gnome-background-properties
    dest: /usr/share/gnome-background-properties
  - type: gschema-overrides
    include:
      - sawfish.gschema.override
  - type: gnome-extensions
    install:
      - 307 # Dash to Dock
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 3193 # Blur my Shell
      - 517 # Caffeine
      - 7065 # Tiling Shell
      - 779 # Clipboard Indicator
      - 1319 # GSConnect
      - 3628 # ArcMenu
      - 4655 # Date Menu Formatter
      - 8098 # Wellbeing Toggle
      - 7048 # Rounded Window Corners Reborn
      - 8261 # SimpleWeather
      - 9983 # Touchshell
  - type: os-release
    properties:
      ID: sawfish
      NAME: Sawfish
      PRETTY_NAME: "LeafOS Workstation ARM64 Codename: Sawfish"
  - type: signing