---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
name: sawfish
description: My Custom Build of Universal Blue's Bluefin LTS Image
base-image: ghcr.io/ublue-os/bluefin
image-version: lts-hwe
alt-tags:
  - stable
  - lts
  - lts-hwe
  - lts-hwe-stable
  - arm64-stable
  - arm64-lts
  - arm64-lts-hwe
  - arm64-lts-hwe-stable
platforms:
  - linux/arm64
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
        - mimalloc
        - git
        - btop
        - gtk2 # needed: for steam on arm64 support
    remove:
      auto-remove: true
      packages:
        - firefox
        - htop
  - type: script
    scripts:
      - "arm64/build.sh"
      #- "arm64/box64.sh"
    snippets:
      - "rm /usr/sysctl.d/ntsync.conf"
  - type: default-flatpaks
    configurations:
    - notify: true
      scope: system
      repo:
        title: Flathub (system)
      install: 
        - app.zen_browser.zen
      remove:
        - org.mozilla.firefox
    - type: containerfile
    snippets:
      - COPY --from ghcr.io/ublue-os/bluefin:stable /usr/share/backgrounds/* /usr/share/backgrounds
      - COPY --from ghcr.io/ublue-os/bluefin:stable /usr/share/gnome-background-properties/* /usr/share/gnome-background-properties
  - type: signing